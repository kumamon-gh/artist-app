name: update-colors
on:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save sharp
      - run: node scripts/update-colors.mjs
