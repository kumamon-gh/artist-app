name: normalize-artists
on:
  push:
    branches: [ main ]
    paths: [ 'artists.json' ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artists-json
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python normalize_artists.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artists.json
          git diff --staged --quiet || (git commit -m "Normalize artists.json" && (git push || (git pull --rebase && git push)))
