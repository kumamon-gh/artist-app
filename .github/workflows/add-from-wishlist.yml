name: add-from-wishlist
on:
  push:
    branches: [ main ]
    paths: [ 'wishlist.txt' ]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: artists-data, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pykakasi alkana
      - run: python add_from_wishlist.py
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save sharp
      - run: node scripts/update-colors.mjs
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "add from wishlist" && git pull --rebase && git push)
